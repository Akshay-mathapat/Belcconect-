name: Security & Quality Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Security & Code Linting
        run: npm run lint

      - name: Run Semgrep Static Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: false

      - name: Build Application Verification
        run: npm run build
