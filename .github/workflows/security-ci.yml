name: Security & Quality Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Dependency Vulnerability Audit
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Run Security & Code Linting
        run: npm --prefix frontend run lint

      - name: Run Semgrep Static Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: true

      - name: Build Application Verification
        run: npm --prefix frontend run build

