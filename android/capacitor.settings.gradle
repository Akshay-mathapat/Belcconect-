def resolveCapDir(String relPath) {
    def f1 = new File('../frontend/node_modules/' + relPath)
    if (f1.exists()) return f1
    return new File('../node_modules/' + relPath)
}

include ':capacitor-android'
project(':capacitor-android').projectDir = resolveCapDir('@capacitor/android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = resolveCapDir('@capacitor/app/android')

include ':capacitor-browser'
project(':capacitor-browser').projectDir = resolveCapDir('@capacitor/browser/android')

